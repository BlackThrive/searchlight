name: pkgdown
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      NO_INTERNET_TEST: true
      VROOM_THREADS: 2
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
      - name: Configure documentation commit identity
        run: |
          git config --local user.name 'Mustapha Mohammed'
          git config --local user.email 'mustapha.wasseja.mohammed@gmail.com'
      - run: Rscript -e 'pkgdown::deploy_to_branch(new_process = FALSE)'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
