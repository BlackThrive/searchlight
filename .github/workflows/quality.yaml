name: Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NO_INTERNET_TEST: true
      VROOM_THREADS: 2
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::styler, any::lintr, any::pkgload, any::spelling
      - name: Style and lint
        run: |
          stopifnot(!any(styler::style_pkg(dry = "on")$changed))
          pkgload::load_all(quiet = TRUE)
          stopifnot(length(lintr::lint_package()) == 0L)
          stopifnot(nrow(spelling::spell_check_package()) == 0L)
        shell: Rscript {0}
      - name: Coverage gate
        run: |
          coverage <- covr::package_coverage()
          stopifnot(covr::percent_coverage(coverage) >= 85)
          covr::to_cobertura(coverage, filename = "coverage.xml")
        shell: Rscript {0}
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
