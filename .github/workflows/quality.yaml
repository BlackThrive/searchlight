name: Quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NO_INTERNET_TEST: true
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::styler, any::lintr, any::pkgload
      - name: Style and lint
        run: |
          stopifnot(!any(styler::style_pkg(dry = "on")$changed))
          pkgload::load_all(quiet = TRUE)
          stopifnot(length(lintr::lint_package()) == 0L)
        shell: Rscript {0}
      - name: Coverage gate
        run: |
          coverage <- covr::package_coverage()
          stopifnot(covr::percent_coverage(coverage) >= 85)
          covr::to_cobertura(coverage, filename = "coverage.xml")
        shell: Rscript {0}
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
